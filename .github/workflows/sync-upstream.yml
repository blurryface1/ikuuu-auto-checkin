name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # UTC 04:00 和 20:00，分别对应北京时间 12:00 和次日 04:00。
    - cron: "0 4,20 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    steps:
      - name: 同步上游 main 分支
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main
